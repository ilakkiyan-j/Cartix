name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Vitest & Build Verification
    runs-on: ubuntu-latest
    env:
      WOOCOMMERCE_URL: https://store.example.com
      WOOCOMMERCE_CONSUMER_KEY: ck_test_dummy_key
      WOOCOMMERCE_CONSUMER_SECRET: cs_test_dummy_secret
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run automated test suite (Vitest)
        run: npm test

      - name: Compile TypeScript bundle
        run: npm run build
